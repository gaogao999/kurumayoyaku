# Render（https://render.com）用のデプロイ設定。
# このリポジトリを連携して「Blueprint」から作成すると、この内容で公開されます。
#
# 注意：SQLiteのデータを保持する永続ディスク（disk:）は Render の有料プランのみ対応です。
#       そのため plan は starter（最小の有料プラン）にしています。
#       「まず無料で試したい」場合は、下の disk: ブロックを削除し plan: free にしてください。
#       ※free + ディスクなしだと、再起動のたびに予約データが消えます（お試し用途のみ）。
services:
  - type: web
    name: kurumayoyaku
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: DB_PATH
        value: /data/kurumayoyaku.db
    disk:
      # SQLiteのデータが消えないように永続ディスクを割り当てる（有料プランのみ）
      name: data
      mountPath: /data
      sizeGB: 1
