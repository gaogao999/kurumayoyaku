# Render (https://render.com) deploy config for the SOP system.
#
# Two ways to deploy:
#   A) Dashboard:  New -> Web Service -> connect this repo
#                  -> Root Directory: sop-system  -> Runtime: Docker
#                  -> add a Disk mounted at /data  -> set env vars below.
#   B) Blueprint:  copy this file to the repository root, then
#                  New -> Blueprint and select this repo.
services:
  - type: web
    name: sop-system
    runtime: docker
    rootDir: sop-system
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DB_PATH
        value: /data/sop.db
      - key: UPLOAD_DIR
        value: /data/uploads
      # Session signing key — generated once and kept by Render
      - key: SESSION_SECRET
        generateValue: true
      # Set your own admin credentials in the Render dashboard
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
    disk:
      # Keep the SQLite DB and uploaded files across deploys
      name: sop-data
      mountPath: /data
      sizeGB: 1
