<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ログイン — SOPファイル管理システム</title>
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body class="login-page">
    <main class="login-card">
      <h1>📋 SOPファイル管理</h1>
      <p class="subtitle">ログインしてください</p>

      <!-- 仕様どおり POST /checklogin に form 送信 -->
      <form method="post" action="/checklogin" class="login-form">
        <label>
          ユーザー名
          <input type="text" name="username" autocomplete="username" required autofocus />
        </label>
        <label>
          パスワード
          <input type="password" name="password" autocomplete="current-password" required />
        </label>
        <button type="submit">ログイン</button>
      </form>

      <p id="error" class="error" hidden>ユーザー名またはパスワードが違います</p>
    </main>

    <script>
      // ?error=1 が付いていればエラー表示
      if (new URLSearchParams(location.search).has('error')) {
        document.getElementById('error').hidden = false;
      }
    </script>
  </body>
</html>
