<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>車の予約</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🚗 車の予約</h1>
    <div class="me">
      <label for="me-select">わたしは：</label>
      <select id="me-select"></select>
      <button id="edit-names" class="link">名前を変更</button>
    </div>
  </header>

  <nav class="weeknav">
    <button id="prev-week">◀ 前の週</button>
    <span id="week-label"></span>
    <button id="next-week">次の週 ▶</button>
    <button id="this-week" class="link">今週へ</button>
  </nav>

  <main id="week-grid"></main>

  <p id="hint">カレンダーの空いている所をタップ → その時間から予約を追加。自分の予約（黒枠）をタップ → 時間の変更・取消ができます。</p>

  <div id="toast" class="toast" hidden></div>

  <!-- 予約の追加・編集ダイアログ -->
  <dialog id="res-dialog">
    <h2 id="res-title"></h2>
    <div class="field">
      <label>開始</label>
      <select id="res-start"></select>
    </div>
    <div class="field">
      <label>終了</label>
      <select id="res-end"></select>
    </div>
    <div class="field">
      <label>メモ</label>
      <input type="text" id="res-note" maxlength="100" placeholder="任意（例：通院・買い物）" />
    </div>
    <menu class="res-menu">
      <button id="res-delete" class="danger" hidden>取消</button>
      <span style="flex:1"></span>
      <button id="res-close">閉じる</button>
      <button id="res-save" class="primary">予約する</button>
    </menu>
  </dialog>

  <!-- 名前変更ダイアログ -->
  <dialog id="names-dialog">
    <h2>メンバーの名前</h2>
    <div id="names-form"></div>
    <menu>
      <button id="names-close">閉じる</button>
    </menu>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
